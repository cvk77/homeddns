configuration:
  auth_username:
    name: "Username"
    description: "Username for Basic Authentication (used by DynDNS clients)"
  auth_password:
    name: "Password"
    description: "Password for Basic Authentication (stored and compared as plain text)"
  dns_provider:
    name: "DNS Provider"
    description: "Choose your DNS hosting provider (netcup_ccp or aws_route53; route53 is accepted as an alias)"
  domain:
    name: "Domain"
    description: "Optional. Zone used for hostnames within it (e.g., example.com or example.co.uk); otherwise the last two labels are used (Netcup) or the zone is discovered automatically (Route53)"
  dns_ttl:
    name: "DNS TTL"
    description: "DNS record Time-To-Live in seconds (lower = faster updates, higher = less DNS queries)"
  port:
    name: "Port"
    description: "HTTP server port (only needed if not using Ingress)"
  log_level:
    name: "Log Level"
    description: "Logging verbosity: debug (verbose), info (default), warn (warnings only), error (errors only)"
  ssl:
    name: "Enable SSL/TLS"
    description: "Enable HTTPS using Home Assistant's SSL certificates"
  certfile:
    name: "Certificate File"
    description: "Path to SSL certificate file (relative to /ssl directory, default: fullchain.pem)"
  keyfile:
    name: "Private Key File"
    description: "Path to SSL private key file (relative to /ssl directory, default: privkey.pem)"
  netcup_customer_number:
    name: "Netcup Customer Number"
    description: "Your Netcup customer number (found in CCP account overview)"
  netcup_api_key:
    name: "Netcup API Key"
    description: "API Key generated in Netcup CCP (Stammdaten → API)"
  netcup_api_password:
    name: "Netcup API Password"
    description: "API Password generated in Netcup CCP"
  aws_access_key_id:
    name: "AWS Access Key ID"
    description: "AWS IAM user access key ID (optional if using IAM roles)"
  aws_secret_access_key:
    name: "AWS Secret Access Key"
    description: "AWS IAM user secret access key"
  aws_region:
    name: "AWS Region"
    description: "AWS region where your Route53 hosted zone is located"

network:
  8053/tcp: "HTTP API port for DynDNS updates (can be disabled if using Ingress)"
