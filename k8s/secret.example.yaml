# Example secret for homeddns. Copy, fill in and apply, or create it with
# `kubectl create secret generic homeddns-secret --from-literal=...`.
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: homeddns-secret
type: Opaque
stringData:
  auth-username: dyndns
  auth-password: your-secure-password
  # Netcup provider only
  netcup-customer-number: "123456"
  netcup-api-key: your-api-key
  netcup-api-password: your-api-password
  # Route53 provider with static credentials only (not needed with IRSA)
  # aws-access-key-id: AKIA...
  # aws-secret-access-key: ...
